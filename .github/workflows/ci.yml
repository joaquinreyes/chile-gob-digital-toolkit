name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 1"

permissions:
  contents: read

jobs:
  check:
    name: lint + typecheck + test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  firmagob-sandbox:
    # Real call to the public FirmaGob TEST environment. Only weekly or on demand,
    # and it does not block the build if that external server is down.
    name: FirmaGob TEST environment (live)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run packages/firmagob/test/sandbox.live.test.ts
        env:
          FIRMAGOB_LIVE: "1"
